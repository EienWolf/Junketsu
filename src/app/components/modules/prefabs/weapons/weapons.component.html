<!-- weapons.component.html -->
<div class="min-h-screen bg-slate-900 text-gray-100">
  <!-- Cabecera -->
  <div class="border-b border-red-900 bg-gray-800 py-6">
    <div class="container mx-auto px-4">
      <h1 class="text-center font-serif text-3xl text-red-600">
        ARSENAL DEL CAZADOR
      </h1>
      <p class="mt-2 text-center text-gray-400">
        Elige tu arma para la cacería nocturna
      </p>
    </div>
  </div>

  <!-- Filtros y búsqueda -->
  <div
    class="sticky top-0 z-10 border-b border-gray-700 bg-gray-800 py-4 shadow-lg"
  >
    <div
      class="container mx-auto flex flex-col items-center justify-between space-y-4 px-4 md:flex-row md:space-y-0"
    >
      <div class="flex w-full items-center md:w-auto">
        <span class="p-input-icon-left w-full md:w-auto">
          <input
            type="text"
            pInputText
            placeholder="Buscar armas"
            [(ngModel)]="searchTerm"
            (input)="onSearchChange()"
            class="w-full border-gray-600 bg-gray-700 px-3 py-2 md:w-64"
          />
        </span>
      </div>

      <div class="mt-3 flex w-full items-center space-x-4 md:w-auto">
        <p-dropdown
          [options]="weaponTypes"
          [(ngModel)]="selectedType"
          optionLabel="label"
          optionValue="value"
          (onChange)="onTypeChange()"
          styleClass="bg-gray-700 border-gray-600"
        >
        </p-dropdown>

        <span class="text-sm text-gray-400">
          {{ filteredWeapons.length }} armas encontradas
        </span>
      </div>
    </div>
  </div>

  <div class="container mx-auto px-4 py-8">
    <div class="flex flex-col space-y-6 lg:flex-row lg:space-y-0 lg:space-x-6">
      <!-- Lista de armas -->
      <div class="custom-scrollbar overflow-y-auto pr-2">
        <div class="grid grid-cols-1 gap-4" style="padding-top: 12px">
          <div
            *ngFor="let weapon of filteredWeapons"
            [routerLink]="['/prefabs/weapons/', weapon.id]"
            class="transform cursor-pointer overflow-hidden rounded-lg border border-gray-700 bg-gray-800 transition-all duration-300 hover:translate-y-[-4px] hover:border-red-800"
            [class.border-red-600]="selectedWeapon?.id === weapon.id"
            (click)="selectWeapon(weapon)"
          >
            <div class="flex items-center p-4">
              <div
                class="mr-4 flex h-16 w-16 items-center justify-center overflow-hidden rounded-lg bg-gray-700"
              >
                <img
                  [src]="weapon.image"
                  [alt]="weapon.name"
                  class="h-12 w-12 object-contain"
                />
              </div>
              <div class="flex-grow">
                <h3 class="text-lg font-medium">{{ weapon.name }}</h3>
                <div class="mt-1 flex items-center">
                  <span
                    [class]="
                      'mr-2 rounded px-2 py-0.5 text-xs ' +
                      getClassForWeaponType(weapon.weapon_type)
                    "
                  >
                    {{ getWeaponTypeLabel(weapon.weapon_type) }}
                  </span>
                  <!-- <span class="text-xs text-gray-400 flex items-center">
                      <i class="pi pi-sword mr-1"></i>DMG: {{ weapon.base_damage }}
                    </span>
                --></div>
              </div>
            </div>
          </div>
        </div>

        <div
          *ngIf="filteredWeapons.length === 0"
          class="py-12 text-center text-gray-500"
        >
          <i class="pi pi-search mb-4 text-4xl"></i>
          <p>No se encontraron armas con los filtros actuales</p>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .custom-scrollbar::-webkit-scrollbar {
    width: 6px;
  }
  .custom-scrollbar::-webkit-scrollbar-track {
    background: #374151;
    border-radius: 3px;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb {
    background: #4b5563;
    border-radius: 3px;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb:hover {
    background: #6b7280;
  }
</style>
