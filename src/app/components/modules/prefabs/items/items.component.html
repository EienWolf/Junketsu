<!-- consumables-list.component.html -->
<div class="min-h-screen bg-slate-900 text-gray-100">
  <!-- Cabecera -->
  <div class="border-b border-red-900 bg-gray-800 py-6">
    <div class="container mx-auto px-4">
      <h1 class="text-center font-serif text-3xl text-red-600">ITEMS</h1>
      <p class="mt-2 text-center text-gray-400">
        Equípate para la cacería nocturna
      </p>
    </div>
  </div>

  <!-- Filtros y búsqueda -->
  <div
    class="sticky top-0 z-10 border-b border-gray-700 bg-gray-800 py-4 shadow-lg"
  >
    <div
      class="container mx-auto flex flex-col items-center justify-between space-y-4 px-4 md:flex-row md:space-y-0"
    >
      <div class="flex w-full items-center md:w-auto">
        <span class="p-input-icon-left w-full md:w-auto">
          <i class="pi pi-search"></i>
          <input
            type="text"
            pInputText
            placeholder="Buscar consumibles..."
            [(ngModel)]="searchTerm"
            (input)="applyFilters()"
            class="w-full border-gray-600 bg-gray-700 px-3 py-2 md:w-64"
          />
        </span>
      </div>

      <div class="mt-3 flex w-full items-center space-x-4 md:w-auto">
        <p-dropdown
          [options]="categoryOptions"
          [(ngModel)]="selectedCategory"
          optionLabel="label"
          optionValue="value"
          (onChange)="applyFilters()"
          styleClass="bg-gray-700 border-gray-600"
          placeholder="Categoría"
        ></p-dropdown>

        <p-dropdown
          [options]="rarityOptions"
          [(ngModel)]="selectedRarity"
          optionLabel="label"
          optionValue="value"
          (onChange)="applyFilters()"
          styleClass="bg-gray-700 border-gray-600"
          placeholder="Rareza"
        ></p-dropdown>

        <span class="text-sm text-gray-400">
          {{ filteredConsumables.length }} objetos encontrados
        </span>
      </div>
    </div>
  </div>

  <div class="container mx-auto px-4 py-8">
    <!-- Lista de Consumibles en Grid -->
    <div
      class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
    >
      <div
        *ngFor="let item of filteredConsumables"
        class="transform cursor-pointer overflow-hidden rounded-lg border border-gray-700 bg-gray-800 transition-all duration-300 hover:translate-y-[-4px] hover:border-red-800 hover:shadow-lg"
        (click)="showDetails(item)"
      >
        <!-- Cabecera con imagen -->
        <div class="relative">
          <!-- Etiqueta de categoría -->
          <span
            class="absolute top-2 left-2 flex items-center rounded-full bg-gray-900 px-2 py-1 text-xs font-medium"
          >
            <i
              class="ra mr-1 text-xs"
              [ngClass]="getCategoryIcon(item.category)"
            ></i>
            {{ item.category }}
          </span>

          <!-- Etiqueta de rareza -->
          <span
            class="absolute top-2 right-2 rounded-full px-2 py-1 text-xs font-medium"
            [ngClass]="getRarityClass(item.rarity)"
          >
            {{ item.rarity }}
          </span>

          <!-- Imagen -->
          <div
            class="flex h-32 w-full items-center justify-center bg-gray-900 p-4"
          >
            <img
              [src]="
                item.image ||
                'https://alchemistcircle.com/wp-content/uploads/2021/02/IMG_7999-1024x768-600x600.png'
              "
              [alt]="item.name"
              class="h-24 object-contain"
              onerror="this.src='https://alchemistcircle.com/wp-content/uploads/2021/02/IMG_7999-1024x768-600x600.png'"
            />
          </div>
        </div>

        <!-- Detalles -->
        <div class="p-4">
          <div class="mb-2 flex items-center justify-between">
            <h3 class="text-md font-medium">{{ item.name }}</h3>
            <span class="text-sm font-bold text-amber-500">{{
              item.cost
            }}</span>
          </div>

          <p class="mb-2 line-clamp-2 h-8 text-xs text-gray-400">
            {{ item.description }}
          </p>

          <!-- Duración -->
          <div class="mt-2 flex items-center justify-between text-xs">
            <span class="flex items-center">
              <i
                class="ra mr-1 text-xs"
                [ngClass]="getDurationIcon(item.duration)"
              ></i>
              {{ item.duration }}
            </span>

            <span class="flex items-center">
              <i class="ra ra-backpack mr-1 text-xs"></i>
              Slots Use: {{ 1 }}
            </span>
            <span class="flex items-center">
              <i class="ra ra-backpack mr-1 text-xs"></i>
              Stack: {{ item.slot_limit }}
            </span>
          </div>
        </div>
      </div>
    </div>

    <!-- Mensaje si no hay resultados -->
  </div>
</div>
