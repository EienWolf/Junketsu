name: Deploy Angular App

on:
  push:
    branches:
      - main
      - develop
      - release/**

permissions:
  packages: read
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: ${{
        github.ref == 'refs/heads/main' && 'production' ||
        github.ref == 'refs/heads/develop' && 'develop' ||
        startsWith(github.ref, 'refs/heads/release/') && 'stagging'}}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build the project
        run: npm run build -- --configuration=production

      - name: Upload to Azure Storage
        uses: azure/cli@v1
        with:
          inlineScript: |
            az storage blob delete-batch --source '$web' --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} --auth-mode key
            az storage blob upload-batch --destination '$web' --source 'dist/junketsu/browser' --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} --auth-mode key
        env:
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
